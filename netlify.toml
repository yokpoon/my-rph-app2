[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20.10.0"

[[headers]]
  for = "/dskp/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/rpt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
